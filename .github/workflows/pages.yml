# Publishes the site to GitHub Pages every time main changes.
# It builds, runs every findability and safety check, and only deploys if all of them pass.
# Set the repository variable SITE_URL (Settings, Secrets and variables, Actions, Variables)
# to the public address, https://hardno.ai/ . Without it, the GitHub Pages address is used.
#
# Hardening: every step is pinned to an exact commit of GitHub's own actions (a tag can be moved by whoever
# controls it; a commit hash cannot), the job gets only the permissions publishing needs, and it runs only
# for main. No third-party code runs anywhere in the build.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and check
        run: python3 build.py --url "${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # The two steps below are what actions/upload-pages-artifact does, written out. That action calls
      # actions/upload-artifact by its tag (@v4) inside itself, and this repository only runs actions pinned to a
      # full commit, so GitHub refused it. Here the upload is pinned to a commit like every other step.
      - name: Archive the site for Pages
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
